---
name: "JK-BMS wired management"
version: 4.2.79
slug: "smartphoton_jkbms"
description: DEV / TEST - JK-BMS Management via RS485, CAN bus, USB or TCP/IP Gateway
url: https://domosimple.eu/forum/thread-917.html
ingress: false
ingress_stream: false
panel_icon: mdi:sitemap
init: false
homeassistant: 2025.10.1
stage: experimental

arch:
  - aarch64
  - amd64

privileged:
  - NET_ADMIN
  - SYS_RAWIO

ports:
  "1891/tcp": 1891

ports_description:
  "1891/tcp": Web interface

hassio_api: true
hassio_role: manager
homeassistant_api: true
host_network: true
auth_api: true
uart: true

map:
  - config:rw
  - media:rw
  - share:rw

options:
  # JK-BMS / communication
  communication_debug: false
  bms_broadcasting: false

  # Multi-Pack
  multi_pack_section: "────────── MULTI-PACK ──────────"
  multi_pack_enabled: false
  multi_pack_active_polling: false
  multi_pack_packs:
    - id: "pack_1"
      name: "Pack 1"
      transport: "tcp"
      gateway_ip_port: "192.168.1.100:5000"

  # Legacy / mono-bus
  legacy_section: "────────── LEGACY / MONO-BUS ──────────"
  jkbms_path: "/dev/serial/by-id/usb-xxxx_USB_Serial-abcdefghij"
  jkbms_count: 1
  use_gateway: false
  gateway_ip_port: "192.168.1.100:5000"
  non_broadcasting_data_interval_s: 3
  CAN_bus_usage: false

  # MQTT
  mqttadresse_port: "core-mosquitto.local.hass.io:1883"
  mqttuser: "username"
  mqttpass: "password"

  # Telemetry
  Send_bip: true

  # Premium
  premium_section: "────────── PREMIUM ──────────"
  premium_key: ""

  # Dashboard
  dashboard_section: "────────── DASHBOARD ──────────"
  dashboard_custom_cards_installed: false
  dashboard_language: "fr"
  dashboard_mode: "legacy"

schema:
  # JK-BMS / communication
  communication_debug: bool
  bms_broadcasting: bool

  # Multi-Pack
  multi_pack_section: str?
  multi_pack_enabled: bool
  multi_pack_active_polling: bool?
  multi_pack_packs:
    - id: "match(^pack_[1-5]$)"
      name: str
      transport: "list(tcp|serial)?"
      gateway_ip_port: str?
      path: str?
      bms_addresses: str?

  # Legacy / mono-bus
  legacy_section: str?
  jkbms_path: str
  jkbms_count: int(1,15)?
  use_gateway: bool
  gateway_ip_port: str?
  non_broadcasting_data_interval_s: float(1,30)
  CAN_bus_usage: bool

  # MQTT
  mqttadresse_port: str?
  mqttuser: str?
  mqttpass: password?

  # Telemetry
  Send_bip: bool

  # Premium
  premium_section: str?
  premium_key: str?

  # Dashboard
  dashboard_section: str?
  dashboard_custom_cards_installed: bool
  dashboard_language: list(fr|en)
  dashboard_mode: list(legacy|html|both)

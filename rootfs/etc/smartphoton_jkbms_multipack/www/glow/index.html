<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JK-BMS Multipack Glow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   THÈMES — une couleur = un sens
   vert = OK · orange = à surveiller · rouge = critique
   cyan = équilibrage · violet = flux d'énergie
   ========================================================= */
:root,[data-theme=dark]{
  --bg:#07111d; --bg2:#0b1828; --card:#0f1f33; --card-end:#0c1a2b; --card2:#132740; --line:#1d3552;
  --txt:#e6f1fa; --mut:#8aa3ba; --dim:#5d758c; --glow:#0f2a44;
  --ok:#3ddc84; --warn:#ffb300; --crit:#ef5350; --bal:#29b6f6; --flow:#a78bfa; --off:#6b7f93;
  --s-volt:#94a3b8; --s-cur:#60a5fa; --s-temp:#f472b6; --s-soc:#2dd4bf; --s-delta:#fbbf24;
  --heat-lo:255,112,67; --heat-hi:41,182,246;
  --shadow:0 1px 0 rgba(255,255,255,.02) inset;
}
[data-theme=light]{
  --bg:#eef3f8; --bg2:#e4ecf4; --card:#ffffff; --card-end:#f8fbfd; --card2:#eef4fa; --line:#d5e0ea;
  --txt:#0f1d2b; --mut:#4b6278; --dim:#7d91a4; --glow:#dbe9f7;
  --ok:#16a34a; --warn:#d97706; --crit:#dc2626; --bal:#0284c7; --flow:#7c3aed; --off:#94a3b8;
  --s-volt:#64748b; --s-cur:#2563eb; --s-temp:#db2777; --s-soc:#0d9488; --s-delta:#ca8a04;
  --shadow:0 1px 3px rgba(15,29,43,.06);
}
:root{--r:14px;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(1200px 600px at 80% -10%,var(--glow) 0%,transparent 60%),var(--bg);color:var(--txt);font:14px/1.45 Inter,system-ui,sans-serif;min-height:100vh;transition:background .3s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:color-mix(in srgb,var(--bg) 85%,transparent);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--flow),#4c1d95);display:grid;place-items:center;font-weight:700;color:#fff}
.brand b{display:block;font-size:15px}.brand small{color:var(--mut);font-size:11px}
.nav-sec{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin:14px 8px 6px}
.nav a,.nav button{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:var(--mut);font-weight:500;width:100%;background:none;border:0;text-align:left}
.nav a:hover,.nav button:hover{background:var(--card2);color:var(--txt)}
.nav a.on{background:color-mix(in srgb,var(--flow) 14%,transparent);color:var(--txt);box-shadow:inset 2px 0 0 var(--flow)}
.nav .sub a{padding-left:30px;font-size:13px}
.nav .badge{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;background:var(--crit);color:#fff}
.nav .badge.warn{background:var(--warn);color:#111}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.mode{font-size:11px;color:var(--mut);padding:6px 10px;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--off);display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}.dot.bal{background:var(--bal)}
.dot.pulse{box-shadow:0 0 0 0 currentColor;animation:pulse 2s infinite}
@keyframes fade{from{opacity:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

main{padding:22px 28px 48px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.crumbs{color:var(--mut);font-size:13px}.crumbs a:hover{color:var(--txt)}
h1{margin:2px 0 0;font-size:24px;letter-spacing:-.01em}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--mut);margin:26px 0 10px;font-weight:600;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent)}
.pill.bal{color:var(--bal);border-color:color-mix(in srgb,var(--bal) 40%,transparent)}
.pill.flow{color:var(--flow);border-color:color-mix(in srgb,var(--flow) 40%,transparent)}
.pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:13px}
.btn:hover{border-color:var(--flow)}
.btn.primary{background:var(--flow);border-color:var(--flow);color:#fff}
.btn.danger{background:var(--crit);border-color:var(--crit);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Cards ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:linear-gradient(180deg,var(--card),var(--card-end));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card.link{cursor:pointer;transition:border-color .15s,transform .15s}
.card.link:hover{border-color:color-mix(in srgb,var(--flow) 60%,transparent);transform:translateY(-1px)}
.stale{position:relative}
.stale>*:not(.stale-tag){opacity:.45;filter:grayscale(.7)}
.stale-tag{position:absolute;top:10px;right:12px;z-index:2}

.kpi .lbl{color:var(--mut);font-size:12px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.kpi .val{font:700 22px/1.2 var(--mono);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val small{font-size:13px;color:var(--mut);font-weight:500;margin-left:3px}
.kpi .sub{color:var(--dim);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.ok .val{color:var(--ok)}.kpi.warn .val{color:var(--warn)}.kpi.crit .val{color:var(--crit)}.kpi.bal .val{color:var(--bal)}.kpi.flow .val{color:var(--flow)}
.trend{font:600 11px var(--mono);color:var(--mut);white-space:nowrap}
.trend.up-bad,.trend.down-bad{color:var(--warn)}
.trend.up-good,.trend.down-good{color:var(--ok)}

/* Status banner */
.banner{display:flex;align-items:center;gap:16px;padding:16px 20px;border-radius:16px;border:1px solid;margin-bottom:14px}
.banner.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 8%,var(--card))}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 9%,var(--card))}
.banner.crit{border-color:color-mix(in srgb,var(--crit) 50%,transparent);background:color-mix(in srgb,var(--crit) 10%,var(--card))}
.banner .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--bg2)}
.banner b{font-size:18px;display:block}
.banner small{color:var(--mut)}
.banner .go{margin-left:auto;color:var(--mut);font-size:13px;white-space:nowrap}

/* Parc de sites (packs distants) */
.fleet-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.fleet{padding:6px 0}
.fl-row{display:grid;grid-template-columns:minmax(150px,1.4fr) minmax(120px,1.2fr) minmax(130px,1.1fr) minmax(90px,.8fr) minmax(100px,.9fr) 90px;gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.fl-row:last-child{border-bottom:0}
.fl-row:hover{background:var(--card2)}
.fl-row.head{cursor:default;padding-top:6px;padding-bottom:6px;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.fl-row.head:hover{background:none}
.fl-name b{display:flex;align-items:center;gap:8px;font-size:14px}
.fl-name small{color:var(--mut);font-size:11px;margin-left:16px}
.fl-soc{display:flex;align-items:center;gap:10px;font:700 15px var(--mono)}
.fl-soc .bar{flex:1;margin:0}
.fl-v{font:700 14px var(--mono);white-space:nowrap}
.fl-v small{font:500 11px Inter,sans-serif;color:var(--mut);display:block}
.fl-row.stale>*{opacity:.5}
.mflow{display:flex;align-items:center;gap:6px;font-size:15px}
.stb{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 8px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid}
.stb .arw{font-style:normal;font-size:9px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff}
.stb.chg{color:var(--s-soc);border-color:color-mix(in srgb,var(--s-soc) 40%,transparent);background:color-mix(in srgb,var(--s-soc) 10%,transparent)}
.stb.chg .arw{background:var(--s-soc);animation:up 1.6s ease-in-out infinite}
.stb.dis{color:var(--flow);border-color:color-mix(in srgb,var(--flow) 40%,transparent);background:color-mix(in srgb,var(--flow) 10%,transparent)}
.stb.dis .arw{background:var(--flow);animation:down 1.6s ease-in-out infinite}
.stb.idle{color:var(--mut);border-color:var(--line)}
.stb.idle .arw{background:var(--off);font-size:7px}
@keyframes up{0%,100%{transform:translateY(1px)}50%{transform:translateY(-2px)}}
@keyframes down{0%,100%{transform:translateY(-1px)}50%{transform:translateY(2px)}}
.mflow svg{flex:1;height:12px;min-width:40px}
.mflow .wire{stroke:var(--line);stroke-width:6;stroke-linecap:round}
.mflow .stream{stroke:var(--flow);stroke-width:4;stroke-linecap:round;stroke-dasharray:1 9;animation:dash linear infinite}
.mflow .stream.rev{animation-direction:reverse}
@keyframes dash{to{stroke-dashoffset:-20}}

/* Pack card */
.pack-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pack-head h3{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.pack-head .st{font-size:11px;color:var(--mut);letter-spacing:.04em;margin-top:3px}
.pack-body{display:grid;grid-template-columns:80px 1fr;gap:16px;margin:14px 0 10px;align-items:center}
.big3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.big3 .l{font-size:11px;color:var(--mut)}
.big3 .v{font:700 19px/1.25 var(--mono);white-space:nowrap}
.big3 .v small{font-size:11px;color:var(--mut);font-weight:500;margin-left:2px}
.big3 .v.warn{color:var(--warn)}.big3 .v.crit{color:var(--crit)}.big3 .v.ok{color:var(--ok)}
.sparkrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:10px;border-top:1px dashed var(--line)}
.spark{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);min-width:0}
.spark svg{flex:1;height:24px;min-width:0}
.details{display:none;margin-top:10px}
.details.open{display:block}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0}
.mini .l{font-size:11px;color:var(--mut)}
.mini .v{font:700 14px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .v small{font-size:11px;color:var(--mut)}
.mini.warn .v{color:var(--warn)}.mini.crit .v{color:var(--crit)}
.more{background:none;border:0;color:var(--mut);font-size:12px;padding:4px 0}
.more:hover{color:var(--txt)}
.cardfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.fresh{font-size:11px;color:var(--dim);white-space:nowrap}
.fresh.old{color:var(--warn)}

/* SOC battery */
.batt{position:relative;width:56px;height:96px;margin:0 auto}
.batt .cap{width:22px;height:6px;border-radius:3px 3px 0 0;background:var(--line);margin:0 auto}
.batt .in{position:relative;height:88px;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg2)}
.batt .fill{position:absolute;left:3px;right:3px;bottom:3px;border-radius:6px;background:linear-gradient(0deg,var(--c),color-mix(in srgb,var(--c) 55%,white));height:calc((100% - 6px) * var(--s) / 100);transition:height .6s}
.batt .pct{position:absolute;inset:6px 0 0;display:grid;place-items:center;font:700 15px var(--mono);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.bar{height:6px;border-radius:9px;background:var(--bg2);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--c,var(--flow))}

/* Cells bars */
.cells{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:6px;align-items:end;height:170px;padding-top:6px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.cell .col{width:100%;max-width:34px;border-radius:6px 6px 3px 3px;background:linear-gradient(0deg,color-mix(in srgb,var(--s-volt) 50%,var(--bg2)),var(--s-volt));min-height:6px}
.cell.min .col{background:linear-gradient(0deg,color-mix(in srgb,var(--crit) 40%,var(--bg2)),var(--crit))}
.cell.max .col{background:linear-gradient(0deg,color-mix(in srgb,var(--ok) 40%,var(--bg2)),var(--ok))}
.cell.balc .col{box-shadow:0 0 0 2px var(--bal)}
.cell .v{font:600 10px var(--mono);color:var(--mut);writing-mode:vertical-rl;transform:rotate(180deg)}
.cell.min .v{color:var(--crit)}.cell.max .v{color:var(--ok)}
.cell .n{font-size:10px;color:var(--dim)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:10px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}

/* Mini-graphes des cartes */
.minicharts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-top:12px;border-top:1px dashed var(--line)}
.mchart .t{font-size:11px;margin-bottom:4px}
.mchart .t b{font-size:12px}
.mchart .ch-plot{height:64px;margin-left:30px}
.mchart .ch-y{left:-32px;width:28px;font-size:9px}
.mchart .ch-x{margin-left:30px;font-size:9px}
.mchart .ch-x span:nth-child(2),.mchart .ch-x span:nth-child(4){display:none}
.mchart .ch-empty{height:64px}
.ch-grid{position:absolute;left:0;right:0;border-top:1px dashed var(--line);opacity:.6;pointer-events:none}
/* État des cellules (lisible) */
.cm-intro{color:var(--mut);font-size:13px;margin-bottom:14px;max-width:820px}
.cm-intro b{color:var(--txt)}
.cm{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.cm-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.cm-head .ic{font-size:18px;line-height:1.2}
.cm-head b{display:block;font-size:14px}
.cm-head small{color:var(--mut);font-size:12px}
.cm-plot{position:relative;height:110px;margin-left:64px}
.cm-y{position:absolute;left:-66px;width:60px;text-align:right;font:500 10px/1.2 var(--mono);color:var(--dim);transform:translateY(-50%)}
.cm-y b{color:var(--mut)}
.cm-mid{position:absolute;left:0;right:0;top:50%;border-top:1.5px solid var(--mut);opacity:.7}
.cm-zone{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--ok) 10%,transparent);border-radius:4px}
.cm-bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.cm-col{position:relative;cursor:help}
.cm-col:hover{background:color-mix(in srgb,var(--txt) 6%,transparent);border-radius:4px}
.cm-col i{position:absolute;left:18%;right:18%;border-radius:3px;background:var(--ok)}
.cm-col.mid i{background:var(--warn)}
.cm-col.big i{background:var(--crit)}
.cm-col.sus i{background:var(--flow)}
.cm-col em{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px}
.cm-x{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;margin:4px 0 0 64px;font-size:10px;color:var(--dim);text-align:center}
.cm-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mut);margin-top:12px}
.cm-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.cm-legend .cm-z::before{background:color-mix(in srgb,var(--ok) 18%,transparent)}
/* Heatmap */
.heat{display:grid;gap:4px;overflow-x:auto}
.heat .row{display:grid;grid-template-columns:70px repeat(16,minmax(34px,1fr));gap:4px;align-items:center}
.heat .hd{font-size:10px;color:var(--dim);text-align:center}
.heat .lb{font-size:12px;color:var(--mut);font-weight:600}
.heat .hc{height:38px;border-radius:7px;display:grid;place-items:center;font:600 10px var(--mono);color:var(--txt);border:1px solid var(--line);cursor:default}
.heat .hc.weak{outline:2px dashed var(--warn);outline-offset:-3px}
.heatlegend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut);margin-top:10px}
.heatlegend i{height:8px;width:160px;border-radius:9px;background:linear-gradient(90deg,rgb(var(--heat-lo)),var(--card2),rgb(var(--heat-hi)))}

/* Tables */
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:11px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-family:var(--mono);font-weight:600;white-space:nowrap}
.tbl td:first-child{color:var(--mut)}
.tbl tr.diff td{background:color-mix(in srgb,var(--warn) 8%,transparent)}
.tbl tr.diff td.num.odd{color:var(--warn)}
.tbl tr.sec td{background:var(--bg2);color:var(--txt);font-weight:600;font-size:12px}
.tdiff{display:block;font-size:10px;color:var(--warn);font-family:Inter,sans-serif;font-weight:500}
.tblwrap{overflow-x:auto}

/* Toggle & inputs */
.tg{width:36px;height:20px;border-radius:99px;background:var(--line);position:relative;display:inline-block;vertical-align:middle;border:0;padding:0;flex:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--mut);transition:.2s}
.tg.on{background:color-mix(in srgb,var(--ok) 40%,transparent)}.tg.on::after{left:19px;background:var(--ok)}
.tg[disabled]{cursor:default}
.tg.changed{box-shadow:0 0 0 2px var(--flow)}
.inp{width:110px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg2);text-align:right;font-family:var(--mono)}
.inp:focus{outline:2px solid var(--flow);border-color:transparent}
.inp.changed{border-color:var(--flow);color:var(--flow)}
.sw-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;gap:10px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:12px;color:var(--mut)}
.field input[type=text],.field input[type=password]{padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg2);width:100%}

/* Tabs / segmented */
.tabs,.seg{display:flex;gap:4px;background:var(--bg2);border:1px solid var(--line);padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow:auto}
.tabs a,.seg button{padding:7px 14px;border-radius:9px;color:var(--mut);font-weight:500;white-space:nowrap;background:none;border:0}
.seg button{padding:4px 11px;font-size:12px}

/* Alerts & events */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}

.ev{display:grid;grid-template-columns:52px 14px 1fr;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);align-items:start}

@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.cells .v{display:none}.fleet-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.fl-row{grid-template-columns:minmax(140px,1.4fr) minmax(110px,1fr) minmax(110px,1fr) minmax(90px,.8fr) minmax(90px,.8fr)}.fl-row .fl-fresh{display:none}}

body{background:

  var(--bg); background-attachment:fixed}

/* Cartes effet verre + liseré lumineux */
.card,.banner,.fleet{position:relative;overflow:hidden;
  background:linear-gradient(160deg, color-mix(in srgb,var(--card) 92%,white 8%) 0%, var(--card) 35%, var(--card-end) 100%);
  border:1px solid color-mix(in srgb,var(--flow) 28%,var(--line));
  box-shadow:0 0 0 1px rgba(255,255,255,.03) inset, 0 1px 0 rgba(255,255,255,.12) inset, 0 10px 30px -12px color-mix(in srgb,var(--flow) calc(var(--halo)*60%),transparent), 0 2px 8px rgba(0,0,0,.18)}
.card::before,.fleet::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 35%)}
.card.link::after,.fl-row::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.08),transparent);transform:skewX(-18deg);transition:none;opacity:0}

.fl-row{position:relative;overflow:hidden}

/* Valeurs lumineuses */

[data-theme=light] .kpi.ok .val,[data-theme=light] .kpi.warn .val,[data-theme=light] .kpi.crit .val,[data-theme=light] .kpi.flow .val{text-shadow:0 0 10px color-mix(in srgb,currentColor 35%,transparent)}

@keyframes rise{0%{top:100%}100%{top:-30%}}
.batt .fill{overflow:hidden}

/* Barres de progression néon */
.bar{background:color-mix(in srgb,var(--bg2) 70%,black 10%);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}

/* Barres de cellules brillantes */
.cell .col{background:linear-gradient(90deg,color-mix(in srgb,var(--s-volt) 55%,black),var(--s-volt) 45%,color-mix(in srgb,var(--s-volt) 75%,white) 60%,color-mix(in srgb,var(--s-volt) 60%,black))}
.cell.min .col{background:linear-gradient(90deg,color-mix(in srgb,var(--crit) 55%,black),var(--crit) 45%,color-mix(in srgb,var(--crit) 55%,white) 60%,color-mix(in srgb,var(--crit) 60%,black));box-shadow:0 0 8px color-mix(in srgb,var(--crit) 45%,transparent)}
.cell.max .col{background:linear-gradient(90deg,color-mix(in srgb,var(--ok) 55%,black),var(--ok) 45%,color-mix(in srgb,var(--ok) 55%,white) 60%,color-mix(in srgb,var(--ok) 60%,black));box-shadow:0 0 8px color-mix(in srgb,var(--ok) 45%,transparent)}

/* Courbes avec halo */

.ch-plot svg{color:var(--flow)}

.banner.crit{box-shadow:0 0 18px -8px color-mix(in srgb,var(--crit) 55%,transparent)}

.side{background:linear-gradient(180deg,color-mix(in srgb,var(--card) 70%,transparent),color-mix(in srgb,var(--bg) 85%,transparent));backdrop-filter:blur(14px)}
h2{color:color-mix(in srgb,var(--flow) 45%,var(--mut))}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

<script>
/* =========================================================
   CONFIGURATION
   ========================================================= */
const TH = { deltaWarn:20, deltaCrit:50, tempWarn:40, tempCrit:50, socWarn:50, socCrit:20, staleSec:30, autonomyFloor:20 };
const MIN = 60000, NMIN = 7*24*60;                 // historique démo : 7 jours à la minute
const RANGES = { '1h':60, '24h':1440, '7j':10080 };

/* Définition des paramètres (suffixes = entités HA number.pack_X_bms_Y_<suffixe>) */
const PARAM_DEF = {
  'Tensions cellules': [
    ['bms_smart_sleep_voltage','Tension Smart Sleep','V',2,3.30],['bms_balance_starting_voltage','Tension de début équilibrage','V',2,3.40],
    ['bms_balance_trigger_voltage','Delta déclenchement équilibrage','V',3,0.005],['bms_cell_request_charge_voltage','Tension cellule demande charge','V',2,3.50],

  'Courants & capacité': [

  'Protections': [

    ['bms_charge_undertemperature_protection','Protection sous-température charge','°C',0,2],['bms_charge_undertemperature_protection_recovery','Récupération sous-température charge','°C',0,5],

};
const SW_DEF = [['charging_switch','MOS charge',true],['discharging_switch','MOS décharge',true],['balance_switch','Équilibrage',true],['heating_switch','Chauffage',false],
  ['display_always_on_switch','Écran toujours allumé',false],['smart_sleep_switch','Smart Sleep',true],['disable_pcl_module_switch','Désactiver module PCL',false],
  ['timed_stored_data_switch','Stockage temporisé',false],['charging_floating_mode','Mode Floating charge',true]];
const PARAM_INDEX = {}; Object.entries(PARAM_DEF).forEach(([g,rows])=>rows.forEach(r=>PARAM_INDEX[r[0]]={g,label:r[1],unit:r[2],dec:r[3]}));

/* =========================================================
   ÉTAT
   ========================================================= */
const S = { mode:'waiting', autoRouteApplied:false, range:'24h', expanded:new Set(), edit:null, modal:null, logFilter:'all', diffOnly:false,
            ws:null, wsId:1, pending:{}, haStatus:'Non connecté', haUrl:'', histCache:{}, dirty:false };

const store = { get(k){ try{return localStorage.getItem(k)}catch(e){return null} }, set(k,v){ try{localStorage.setItem(k,v)}catch(e){} }, del(k){ try{localStorage.removeItem(k)}catch(e){} } };

/* =========================================================
   GÉNÉRATION DES DONNÉES DE DÉMO (physiquement plausibles)
   ========================================================= */
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const r = (a,b) => a + rnd()*(b-a);
const ocv = s => 2.9 + 0.35*(1-Math.exp(-s/8)) + 0.0009*s + (s>97 ? (s-97)*0.04 : 0);

function makeBms(pack, id, o = {}){
  const capNom = o.capNom ?? 280, dBase = o.dBase ?? r(4,8), ph = r(0,6), peak = o.peak ?? r(26,38), load = o.load ?? r(5,7.5);
  const t0 = Date.now() - (NMIN-1)*MIN;
  const H = { t0, cur:new Array(NMIN), soc:new Array(NMIN), volt:new Array(NMIN), delta:new Array(NMIN), temp:new Array(NMIN) };
  let s = 60;
  for (let i=0;i<NMIN;i++){
    const d = new Date(t0+i*MIN), h = d.getHours()+d.getMinutes()/60, day = Math.floor(i/1440);
    const cloud = 0.62 + 0.38*Math.sin(i/53+day*1.7+ph)*Math.sin(i/211+ph);
    const sun = Math.max(0,Math.sin(Math.PI*(h-7)/12))**1.4 * peak * Math.max(0.15,cloud);
    const ld = load + 5*Math.exp(-((h-20)**2)/3) + 3*Math.exp(-((h-7.5)**2)/1.5) + Math.sin(i/7+ph)*0.7;
    let c = sun - ld; if (s>=99.5 && c>0) c = Math.min(c,0.4);
    s = Math.max(2, Math.min(100, s + c/capNom*100/60));
    H.cur[i]=c; H.soc[i]=s;
  }
  const corr = o.soc - H.soc[NMIN-1];
  for (let i=0;i<NMIN;i++){
    const d = new Date(t0+i*MIN), h = d.getHours()+d.getMinutes()/60;
    const sc = Math.max(1, Math.min(100, H.soc[i] + corr*i/(NMIN-1)));
    H.soc[i] = sc;
    H.volt[i] = 16*(ocv(sc) + H.cur[i]*0.0006);
    H.delta[i] = dBase + (sc>92 ? (sc-92)*2.5 : 0) + (sc<15 ? (15-sc)*1.4 : 0) + (Math.sin(i/170+ph)+1)*1.2 + Math.sin(i/41+ph*2)*0.4;
    H.temp[i] = 17 + 4*Math.sin(Math.PI*(h-10)/12) + Math.abs(H.cur[i])*0.2 + (o.tOff ?? 0) + Math.sin(i/29+ph)*0.6;
  }
  // motif des cellules : la cellule faible reste la plus basse
  const pattern = Array.from({length:16},()=>r(-0.45,0.5));
  if (o.weak) pattern[o.weak.cell-1] = -0.5;
  const res30 = Array.from({length:16},(_,c)=>{ const base=r(0.06,0.095); const rise=(o.weak&&o.weak.cell===c+1)?o.weak.resRise/100:r(0,0.04);
    return Array.from({length:30},(_,d)=>+(base*(1+rise*d/29)+(rnd()-.5)*0.002).toFixed(4)); });
  const params = {}; Object.values(PARAM_DEF).flat().forEach(p=>params[p[0]]=p[4]);
  params.bms_total_battery_capacity_ah = capNom; Object.assign(params, o.params||{});
  const switches = {}; SW_DEF.forEach(s=>switches[s[0]]=s[2]);
  const b = { pack, id, online:true, ts:Date.now(), H, pattern, res30, params, switches, capNom,
    soh:o.soh ?? Math.round(r(94,100)), cycles:Math.round(r(40,320)), runtime:`${Math.round(r(80,420))} j ${Math.round(r(0,23))} h`,
    weak:o.weak ?? {cell:pattern.indexOf(Math.min(...pattern))+1, lowestDays:Math.round(r(1,2)), resRise:0},
    tOff:o.tOff??0, staleSim:!!o.staleSim, chargeMos:true, dischargeMos:true, alarms:[] };
  syncFromHistory(b);
  return b;
}
function syncFromHistory(b){
  const L = b.H.cur.length-1;
  b.current = b.H.cur[L]; b.soc = b.H.soc[L]; b.voltage = b.H.volt[L]; b.mos = b.H.temp[L];
  b.t1 = b.mos - 4 - b.tOff*0.6; b.t2 = b.t1 + 0.8;
  b.power = b.voltage*b.current; b.capRem = b.capNom*b.soc/100;
  b.deltaMv = b.H.delta[L];
  const avg = b.voltage/16, mn=Math.min(...b.pattern), mx=Math.max(...b.pattern);
  b.cells = b.pattern.map(p => avg + (p-(mn+mx)/2)/(mx-mn)*b.deltaMv/1000);
  b.res = b.res30.map(a=>a.at(-1));
  b.balance = (b.deltaMv>15 && b.soc>88 && b.switches.balance_switch) ? Math.min(b.params.bms_max_balance_current, 0.15+b.deltaMv/60) : 0;
  b.alarms = b.soc < 15 ? ['Sous-tension cellule'] : [];
  b.chargeStatus = b.current>0.3 ? (b.soc>97?'Charge (Float)':'Charge (Bulk)') : b.current<-0.3 ? 'Décharge' : 'Repos';
}

/* Journal construit à partir de l'historique */
function buildEvents(){
  const ev = [], now = Date.now(), from = NMIN - 48*60;
  const add = (t,lvl,cat,pack,bms,txt,det='') => ev.push({t,lvl,cat,pack,bms,txt,det});
  PACKS.forEach(p=>{
    let state=null, cand=null, cnt=0;
    for (let i=from;i<NMIN;i+=5){
      const c = p.bms.reduce((a,b)=>a+b.H.cur[i],0);
      const st = c>3?'chg':c<-3?'dis':'idle';
      if (state===null){state=st;continue}
      if (st!==state){ if(st===cand){ if(++cnt>=6){ const t=p.bms[0].H.t0+(i-25)*MIN;
          add(t,'info','flow',p.id,null, st==='chg'?'Début de charge':st==='dis'?'Début de décharge':'Passage au repos', `${f(Math.abs(c),1)} A sur le pack`); state=st; cand=null; } } else {cand=st;cnt=1} } else cand=null;
    }
    p.bms.forEach(b=>{
      let bal=false, hot=false, low=false;
      for (let i=from;i<NMIN;i+=2){
        const t=b.H.t0+i*MIN, isBal=b.H.delta[i]>15&&b.H.soc[i]>88, isHot=b.H.temp[i]>=TH.tempWarn, isLow=b.H.soc[i]<15;
        if(isBal!==bal){ add(t,isBal?'bal':'ok','bal',p.id,b.id,isBal?'Équilibrage démarré':'Équilibrage terminé',`Δ ${f(b.H.delta[i],0)} mV · SOC ${f(b.H.soc[i],0)} %`); bal=isBal; }
        if(isHot!==hot){ add(t,isHot?'warn':'ok','alarm',p.id,b.id,isHot?`Température MOS ≥ ${TH.tempWarn} °C`:'Température MOS revenue à la normale',`${f(b.H.temp[i],1)} °C`); hot=isHot; }
        if(isLow!==low){ add(t,isLow?'crit':'ok','alarm',p.id,b.id,isLow?'Alarme : sous-tension cellule':'Alarme sous-tension levée',`SOC ${f(b.H.soc[i],0)} %`); low=isLow; }
      }
    });
  });
  add(now-26*3600e3,'info','param',4,3,'Paramètre modifié','Delta déclenchement équilibrage : 0,005 → 0,010 V');
  add(now-31*3600e3,'info','param',1,2,'Paramètre modifié','Courant de charge maximal : 100 → 80 A');
  return ev.sort((a,b)=>b.t-a.t);
}

const bn = b => b.key==='master' ? 'BMS master' : `BMS ${b.id}`;
const tmax = b => Math.max(b.t1,b.t2,b.mos);

function agg(list){
  const on = list.filter(b=>b.online), n = on.length||1, sum = k => on.reduce((a,b)=>a+(b[k]||0),0);
  return { online:on.length>0, count:list.length, voltage:sum('voltage')/n, current:sum('current'), power:sum('power'),
    soc:sum('soc')/n, capRem:sum('capRem'), capNom:sum('capNom'), delta:Math.max(0,...on.map(b=>b.deltaMv)), temp:Math.max(0,...on.map(tmax)),
    balancing:on.some(b=>b.balance>0), alarms:on.flatMap(b=>b.alarms.map(a=>`${bn(b)} · ${a}`)), stale:on.some(isStale), ts:Math.min(...list.map(b=>b.ts)) };
}
const lvl = (v,w,c,inv=false) => inv ? (v<=c?'crit':v<=w?'warn':'ok') : (v>=c?'crit':v>=w?'warn':'ok');
const socL = s => lvl(s,TH.socWarn,TH.socCrit,true), dL = d => lvl(d,TH.deltaWarn,TH.deltaCrit), tL = t => lvl(t,TH.tempWarn,TH.tempCrit);
function stateL(a){ if(!a.online) return 'off'; if(a.alarms.length||dL(a.delta)==='crit'||tL(a.temp)==='crit') return 'crit';
  if(dL(a.delta)==='warn'||tL(a.temp)==='warn'||a.stale) return 'warn'; return a.balancing?'bal':'ok'; }
const allBms = () => PACKS.flatMap(p=>p.bms);

function autonomy(capRem, capNom, current){
  const fmt = h => h>99 ? '> 99 h' : `${Math.floor(h)} h ${String(Math.round((h%1)*60)).padStart(2,'0')}`;
  if (current < -0.3){ const h=(capRem - TH.autonomyFloor/100*capNom)/-current; return {v:h<=0?'Atteint':fmt(h), sub:`avant ${TH.autonomyFloor} %`, ic:'⏳', mode:'dis'}; }
  if (current > 0.3){ const h=(capNom-capRem)/current; return {v:fmt(h), sub:'avant 100 %', ic:'⚡', mode:'chg'}; }
  return {v:'—', sub:'au repos', ic:'•', mode:'idle'};
}

function issues(){
  const out=[];
  PACKS.forEach(p=>{ if(p.expectedBms && p.bms.length<p.expectedBms) out.push({lvl:'warn',where:p.name,href:'#/settings',txt:`${p.expectedBms-p.bms.length} BMS non détecté${p.expectedBms-p.bms.length>1?'s':''} (${p.bms.length}/${p.expectedBms})`,act:'Les entités de ce BMS ne suivent pas le nommage attendu : voir « Entités détectées » dans Connexion Home Assistant.'}); });
  PACKS.forEach(p=>p.bms.forEach(b=>{
    const t=tmax(b), where=`${p.name} · ${bn(b)}`, href=`#/pack/${p.id}/bms/${b.id}`;
    if(!b.online) out.push({lvl:'crit',where,href:href+'/alarms',txt:'BMS hors ligne',act:'Vérifier la liaison RS485 / USB.'});
    b.alarms.forEach(a=>out.push({lvl:'crit',where,href:href+'/alarms',txt:a,act:'Recharger le pack, vérifier la cellule la plus basse.'}));
    if(b.deltaMv>=TH.deltaWarn) out.push({lvl:dL(b.deltaMv),where,href:href+'/live',txt:`Écart cellules ${f(b.deltaMv,0)} mV`,act:'Surveiller l’équilibrage, contrôler le serrage de la cellule concernée.'});
    if(t>=TH.tempWarn) out.push({lvl:tL(t),where,href:href+'/live',txt:`Température ${f(t,1)} °C`,act:'Vérifier la ventilation et le serrage des barres.'});
    if(b.soc<=TH.socCrit && !b.alarms.length) out.push({lvl:'warn',where,href:href+'/live',txt:`SOC bas ${f(b.soc,0)} %`,act:'Prévoir une recharge.'});
    if(isStale(b)) out.push({lvl:'warn',where,href:href+'/live',txt:'Données anciennes',act:'Le BMS ne remonte plus de mesures récentes : vérifier la communication.'});
    if(b.weak.lowestDays>=5) out.push({lvl:'warn',where,href:href+'/diag',txt:`Cellule ${b.weak.cell} la plus basse depuis ${b.weak.lowestDays} jours`,act:'Cellule potentiellement faible : contrôler connexion et capacité.'});
    if(b.weak.resRise>=15) out.push({lvl:'warn',where,href:href+'/diag',txt:`Résistance cellule ${b.weak.cell} +${b.weak.resRise} % en 30 j`,act:'Resserrer la barre / nettoyer le contact de la cellule.'});
  }));
  return out.sort((a,b)=>(a.lvl==='crit'?0:1)-(b.lvl==='crit'?0:1));
}

/* Séries pour graphes : {t:[], v:[]} sur la fenêtre choisie */
const HIST_KEYS = { power:['puissance_totale',1], voltage:['tension_totale_volt',1], current:['courant_total',1], temp:['mos_temp',1], soc:['soc_pourcentage',1], delta:['cell_voltage_delta',1000] };
function series(b, key, range){
  const mins = RANGES[range];
  if (S.mode==='ha'){
    const [suf,mult] = HIST_KEYS[key], ent=`sensor.pack_${b.pack}_bms_${bmsKey(b)}_${suf}`, ck=ent+'|'+range;
    const c = S.histCache[ck];
    if (!c){ fetchHistory(ent, mins, mult, ck); return null; }
    return c==='loading' ? null : c;
  }
  const H=b.H, L=H.cur.length, step = mins<=60?1:mins<=1440?5:30, t=[], v=[];
  const src = key==='power' ? null : H[{voltage:'volt',current:'cur',temp:'temp',soc:'soc',delta:'delta'}[key]];
  for (let i=Math.max(0,L-mins); i<L; i+=step){
    let acc=0,n=0; for(let j=i;j<Math.min(L,i+step);j++){ acc += key==='power' ? H.cur[j]*H.volt[j] : src[j]; n++; }
    t.push(H.t0+(i+step/2)*MIN); v.push(acc/n);
  }
  return {t,v};
}
/* Valeur il y a N minutes (démo) pour tendances */
function ago(list, key, m){
  if (S.mode==='ha' || !list[0].H) return null;
  const val = b => { const H=b.H, i=H.cur.length-1-m; return key==='soc'?H.soc[i]:key==='delta'?H.delta[i]:key==='temp'?H.temp[i]:H.cur[i]*H.volt[i]; };
  if (key==='soc') return list.reduce((a,b)=>a+val(b),0)/list.length;
  if (key==='power') return list.reduce((a,b)=>a+val(b),0);
  return Math.max(...list.map(val));
}
function sparkData(list, key){
  if (S.mode==='ha' || !list[0].H) return null;
  const out=[]; for(let k=47;k>=0;k--) out.push(ago(list,key,k*30)); return out;
}

const CHARTS = {};
function chart(id, title, list, unit, dec, thresholds=[], opts={}){
  const range = opts.range || S.range, cp = !!opts.compact;
  const ready = list.filter(s=>s.data && s.data.t.length>1);
  const head = `<div class="t"><span>${title}</span>${ready.length===1?`<b>${f(ready[0].data.v.at(-1),dec)} ${unit}</b>`:''}</div>`;
  if (!ready.length) return `<div class="${cp?'mchart':'card'} chart">${head}<div class="ch-empty">${S.mode==='ha'&&list.some(x=>x.data==null)?'Chargement de l’historique…':'Pas d’historique sur la période'}</div></div>`;
  const now=Date.now(), t0=now-RANGES[range]*MIN;
  let mn=Infinity, mx=-Infinity; ready.forEach(s=>s.data.v.forEach(v=>{if(v<mn)mn=v;if(v>mx)mx=v}));
  if(opts.yMin!=null) mn=Math.min(mn,opts.yMin); if(opts.yMax!=null) mx=Math.max(mx,opts.yMax);
  const rg0=(mx-mn)||1; const ths = thresholds.filter(th=>opts.forceTh || (th.v>=mn-rg0*0.6 && th.v<=mx+rg0*0.6));
  ths.forEach(th=>{mn=Math.min(mn,th.v);mx=Math.max(mx,th.v)});
  const pad=(mx-mn)*0.08||1; if(opts.yMin==null) mn-=pad; if(opts.yMax==null) mx+=pad;
  const X=t=>(t-t0)/(now-t0)*1000, Y=v=>(1-(v-mn)/(mx-mn))*100;
  const paths = ready.map(s=>{ const d=s.data.t.map((t,i)=>(i?'L':'M')+X(t).toFixed(1)+' '+Y(s.data.v[i]).toFixed(2)).join(' ');
    return (ready.length===1?`<path d="${d} L${X(s.data.t.at(-1)).toFixed(1)} 100 L${X(s.data.t[0]).toFixed(1)} 100 Z" fill="${s.color}" opacity=".12"/>`:'')+
      `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`; }).join('');
  const thl = ths.map(th=>`<line x1="0" x2="1000" y1="${Y(th.v)}" y2="${Y(th.v)}" stroke="${th.color}" stroke-dasharray="4 4" vector-effect="non-scaling-stroke" opacity=".8"/>`).join('');
  const thLabels = ths.map(th=>`<span class="ch-th" style="top:${Y(th.v)}%;color:${th.color}">${th.label}</span>`).join('');
  CHARTS[id] = { list:ready, unit, dec, t0, t1:now, range };
  const fmtX = t => new Date(t).toLocaleString('fr-FR', range==='7j'?{weekday:'short',hour:'2-digit'}:{hour:'2-digit',minute:'2-digit'});
  return `<div class="${cp?'mchart':'card'} chart">${head}
    <div class="ch-plot" data-chart="${id}"><span class="ch-y" style="top:0">${f(mx,dec)}</span><span class="ch-y" style="top:50%">${f((mx+mn)/2,dec)}</span><span class="ch-y" style="top:100%">${f(mn,dec)}</span>
      ${[25,50,75].map(y=>`<i class="ch-grid" style="top:${y}%"></i>`).join('')}
      <svg viewBox="0 0 1000 100" preserveAspectRatio="none">${thl}${paths}</svg>${thLabels}<div class="ch-cross"></div><div class="ch-tip"></div></div>
    <div class="ch-x"><span>${fmtX(t0)}</span><span>${fmtX(t0+(now-t0)/4)}</span><span>${fmtX((t0+now)/2)}</span><span>${fmtX(t0+(now-t0)*3/4)}</span><span>${cp?'maint.':'maintenant'}</span></div>
    ${ready.length>1?`<div class="ch-legend">${ready.map(s=>`<span style="--c:${s.color}">${s.name}</span>`).join('')}</div>`:''}</div>`;

function nearest(arr,t){ let lo=0,hi=arr.length-1; while(hi-lo>1){const m=(lo+hi)>>1; if(arr[m]<t)lo=m; else hi=m;} return Math.abs(arr[lo]-t)<Math.abs(arr[hi]-t)?lo:hi; }
document.addEventListener('pointermove', e=>{

  if(!plot) return;

  const rc = plot.getBoundingClientRect(), fx = Math.max(0,Math.min(1,(e.clientX-rc.left)/rc.width)), t = c.t0 + fx*(c.t1-c.t0);
  const cross=plot.querySelector('.ch-cross'), tip=plot.querySelector('.ch-tip');
  cross.style.display='block'; cross.style.left=(fx*100)+'%';

function statusBanner(big=false){
  const iss=issues(), crit=iss.filter(i=>i.lvl==='crit'), warn=iss.filter(i=>i.lvl==='warn'), nb=allBms().length;
  const l = crit.length?'crit':warn.length?'warn':'ok';
  const title = crit.length ? `${crit.length} alarme${crit.length>1?'s':''} active${crit.length>1?'s':''}${warn.length?` · ${warn.length} point${warn.length>1?'s':''} à surveiller`:''}`
              : warn.length ? `${warn.length} point${warn.length>1?'s':''} à surveiller` : 'Tout va bien';
  const sub = iss.length ? iss.slice(0,big?3:2).map(i=>`${i.where} : ${i.txt}`).join(' · ') : `${PACKS.length} sites · ${nb} BMS dans les seuils`;
  return `<a class="banner ${l}" href="#/diagnostics"><div class="ic">${l==='crit'?'⛔':l==='warn'?'⚠️':'✅'}</div><div><b>${title}</b><small>${sub}</small></div><span class="go">Voir le diagnostic ›</span></a>`;

function fleetStats(){
  const ag=PACKS.map(p=>({p,a:agg(p.bms)}));
  const live=ag.filter(x=>x.a.online&&!x.a.stale).length;
  const low=ag.filter(x=>x.a.online).sort((x,y)=>x.a.soc-y.a.soc)[0];
  const minBms=allBms().filter(b=>b.online).sort((a,b)=>a.soc-b.soc)[0];
  const dis=ag.map(x=>({...x,au:autonomy(x.a.capRem,x.a.capNom,x.a.current),h:x.a.current<-0.3?(x.a.capRem-TH.autonomyFloor/100*x.a.capNom)/-x.a.current:Infinity})).sort((x,y)=>x.h-y.h);
  return {ag,live,low,minBms,short:dis[0]};
}
function fleetKpis(){
  const F=fleetStats(), cap=agg(allBms());

    ${kpi('📡 Sites à jour',`${F.live} / ${PACKS.length}`,F.live<PACKS.length?'un site ne remonte plus de données récentes':'tous les sites communiquent',F.live<PACKS.length?'warn':'ok')}
    ${kpi('🔋 SOC le plus bas',`${f(F.low.a.soc,0)}<small>%</small>`,`${esc(F.low.p.name)} · BMS le plus bas : ${f(F.minBms.soc,0)} %`,socL(F.low.a.soc))}
    ${kpi('⏳ Autonomie la plus courte',F.short.h===Infinity?'—':F.short.au.v,F.short.h===Infinity?'aucun site en décharge':`${esc(F.short.p.name)} · ${F.short.au.sub}`,F.short.h<6?'warn':'')}

function pageAggregation(){
  const all=allBms().filter(b=>b.online), ag=PACKS.map(p=>agg(p.bms)), t=agg(all);
  let cmin={v:9},cmax={v:0},worst={d:0},hot={t:0};
  PACKS.forEach(p=>p.bms.forEach(b=>{
    b.cells.forEach((v,i)=>{ if(v<cmin.v) cmin={v,w:`${p.name} · ${bn(b)} · C${i+1}`}; if(v>cmax.v) cmax={v,w:`${p.name} · ${bn(b)} · C${i+1}`}; });

    return `<tr data-href="#/pack/${p.id}" style="cursor:pointer"><td><span class="dot ${stateL(a)}"></span> <a href="#/pack/${p.id}" style="color:var(--txt);font-weight:600">${esc(p.name)}</a></td>
    ${cell(a.soc,f(a.soc,0)+' %',a.soc===best(r=>r.a.soc),socL(a.soc))}<td class="num">${pw(a.power).replace(/<\/?small>/g,' ')}</td><td class="num">${au.v}</td>
    ${cell(a.delta,f(a.delta,0)+' mV',a.delta===best(r=>r.a.delta,true),dL(a.delta))}${cell(a.temp,f(a.temp,1)+' °C',false,tL(a.temp))}
    <td class="num">${f(soh,0)} %</td><td class="num">${cyc}</td><td class="num">${fresh(a.ts)}</td></tr>`}).join('')}</table></div>
  <h2>Valeurs extrêmes du parc</h2><div class="grid g4">

    ${kpi('Pire écart interne',f(worst.d,0)+'<small>mV</small>',worst.w,dL(worst.d))}${kpi('Température maximale',f(hot.t,1)+'<small>°C</small>',hot.w,tL(hot.t))}
  </div>
  <h2>SOC des sites ${rangeSeg()}</h2>
  ${chart('agg-soc','SOC des sites',PACKS.map((p,i)=>({name:p.name,color:['var(--s-soc)','var(--flow)','var(--s-cur)','var(--s-temp)'][i%4],data:packSeries(p,'soc')})),'%',0,[{v:TH.socCrit,label:`${TH.socCrit} %`,color:'var(--crit)'}])}`;
  return h;
}
function packSeries(p,key,range=S.range){ // SOC : moyenne · puissance : somme · écart/temp : pire BMS
  const ss=p.bms.map(b=>series(b,key,range)); if(ss.some(s=>!s)) return null;
  if (S.mode==='ha') return ss[0];
  const red = key==='power' ? a=>a.reduce((x,y)=>x+y,0) : key==='soc' ? a=>a.reduce((x,y)=>x+y,0)/a.length : a=>Math.max(...a);
  return {t:ss[0].t, v:ss[0].v.map((_,i)=>red(ss.map(s=>s.v[i])))};
}

function heatmap(p){
  const all=p.bms.flatMap(b=>b.cells), avg=all.reduce((a,c)=>a+c,0)/all.length, span=15;
  let h=`<div class="heat"><div class="row"><span></span>${Array.from({length:16},(_,i)=>`<span class="hd">C${i+1}</span>`).join('')}</div>`;
  p.bms.forEach(b=>{
    h+=`<div class="row"><a class="lb" href="#/pack/${p.id}/bms/${b.id}">${bn(b)}</a>`+b.cells.map((v,i)=>{
      const dev=(v-avg)*1000, t=Math.max(-1,Math.min(1,dev/span)), rgb=t<0?'var(--heat-lo)':'var(--heat-hi)';
      const weak = b.weak.resRise>=15||b.weak.lowestDays>=5 ? b.weak.cell===i+1 : false;
      return `<span class="hc ${weak?'weak':''}" style="background:rgba(${rgb},${(Math.abs(t)*0.85).toFixed(2)})" title="${bn(b)} · cellule ${i+1} : ${f(v,3)} V (${dev>0?'+':''}${f(dev,0)} mV vs moyenne)">${dev>0?'+':''}${f(dev,0)}</span>`;
    }).join('')+`</div>`;
  });
  return h+`</div><div class="heatlegend">−${span} mV <i></i> +${span} mV · écart à la moyenne du pack (${f(avg,3)} V) · <span style="outline:2px dashed var(--warn);padding:0 4px;border-radius:4px">cellule à surveiller</span></div>`;
}

function cellReport(b){
  const avg=b.cells.reduce((a,c)=>a+c,0)/b.cells.length, devs=b.cells.map(v=>(v-avg)*1000);
  const wi=devs.reduce((w,d,i)=>Math.abs(d)>Math.abs(devs[w])?i:w,0), wd=devs[wi], spread=b.deltaMv;
  const suspect = (b.weak.lowestDays>=5||b.weak.resRise>=15) ? b.weak.cell : null;
  let lvl, title, text;
  if (spread < 10){ lvl='ok'; title='Cellules bien équilibrées'; text=`Toutes les cellules ont quasiment la même tension (écart ${f(spread,0)} mV).`; }
  else if (spread < TH.deltaWarn){ lvl='ok'; title='Léger écart, rien d’anormal'; text=`Écart de ${f(spread,0)} mV : normal, l’équilibrage s’en charge.`; }
  else { lvl=dL(spread); const c=suspect?suspect-1:wi, d=devs[c];
    title=`Cellule ${c+1} ${d<0?'plus basse':'plus haute'} que les autres`;
    text=`Elle est ${f(Math.abs(d),0)} mV ${d<0?'en dessous':'au-dessus'} de la moyenne. Écart entre la plus haute et la plus basse : ${f(spread,0)} mV (alerte à ${TH.deltaWarn} mV).`; }
  if (suspect) text += ` 🔎 Cellule ${suspect} à surveiller : ${b.weak.lowestDays>=5?`c’est la plus basse depuis ${b.weak.lowestDays} jours`:`sa résistance a augmenté de ${b.weak.resRise} % en 30 jours`}.`;
  if (b.alarms.length) text += ` ⛔ Alarme en cours : ${b.alarms.join(', ').toLowerCase()} (niveau de charge trop bas).`;
  return {avg,devs,lvl,title,text,suspect,wi};
}
function cellMap(p){
  const reps=p.bms.map(cellReport), maxAbs=Math.max(...reps.flatMap(r=>r.devs.map(Math.abs)));
  const scale=Math.max(20, Math.ceil(maxAbs/10)*10);
  const devCls=(d,i,r)=> r.suspect===i+1 ? 'sus' : Math.abs(d)>=15 ? 'big' : Math.abs(d)>=8 ? 'mid' : 'ok';
  return `<div class="cm-intro">Les 16 cellules d’un BMS doivent avoir <b>la même tension</b>. Chaque barre montre l’écart d’une cellule par rapport à la moyenne : <b>plus les barres sont courtes, mieux c’est.</b></div>
  <div class="grid ${p.bms.length>1?'g2':''}">${p.bms.map((b,k)=>{ const r=reps[k];
    return `<div class="cm">
      <div class="cm-head"><span class="ic">${r.lvl==='ok'?'✅':r.lvl==='warn'?'⚠️':'⛔'}</span><div><b>${bn(b)} · ${r.title}</b><small>${r.text}</small></div></div>
      <div class="cm-plot">
        <span class="cm-y" style="top:0">+${scale} mV</span><span class="cm-y" style="top:50%">moyenne<br><b>${f(r.avg,3)} V</b></span><span class="cm-y" style="top:100%">−${scale} mV</span>
        <i class="cm-zone" style="top:${50-8/scale*50}%;height:${16/scale*50}%"></i><i class="cm-mid"></i>
        <div class="cm-bars">${r.devs.map((d,i)=>{ const h=Math.max(1.5,Math.min(1,Math.abs(d)/scale)*50);
          return `<div class="cm-col ${devCls(d,i,r)}" title="Cellule ${i+1} : ${f(b.cells[i],3)} V — ${Math.abs(d)<1?'pile dans la moyenne':`${f(Math.abs(d),0)} mV ${d<0?'sous':'au-dessus de'} la moyenne`}${r.suspect===i+1?' · à surveiller':''}">
            <i style="${d>=0?`bottom:50%`:`top:50%`};height:${h}%"></i>${r.suspect===i+1?'<em>🔎</em>':''}</div>`; }).join('')}</div>
      </div>
      <div class="cm-x">${b.cells.map((_,i)=>`<span>${i+1}</span>`).join('')}</div>
    </div>`; }).join('')}</div>
  <div class="cm-legend"><span style="--c:var(--ok)">Normal (moins de 8 mV)</span><span style="--c:var(--warn)">Léger écart (8–15 mV)</span><span style="--c:var(--crit)">Écart important (plus de 15 mV)</span><span style="--c:var(--flow)">🔎 Cellule à surveiller dans le temps</span><span class="cm-z">Zone grisée = plage normale</span></div>`;
}

function paramDiffs(p,b){ // {suffix: [{id,val}]} valeurs différentes chez les autres BMS du pack
  const out={}; Object.keys(PARAM_INDEX).forEach(k=>{ const o=p.bms.filter(x=>x!==b&&x.params[k]!=null&&b.params[k]!=null&&Math.abs(x.params[k]-b.params[k])>1e-9); if(o.length) out[k]=o.map(x=>({id:x.id,val:x.params[k]})); });
  return out;
}
function compareView(p){
  const rows=[], cols=p.bms;
  const meas=[['SOC',b=>f(b.soc,0)+' %'],['Tension',b=>f(b.voltage,2)+' V'],['Courant',b=>f(b.current,1)+' A'],['Écart cellules',b=>f(b.deltaMv,0)+' mV'],['Temp. max',b=>f(tmax(b),1)+' °C'],['SOH',b=>b.soh+' %'],['Cycles',b=>b.cycles],['Résistance moy.',b=>f(b.res.reduce((a,c)=>a+c,0)/16*1000,0)+' mΩ']];
  let nd=0;
  rows.push(`<tr class="sec"><td colspan="${cols.length+1}">Mesures</td></tr>`);
  if(!S.diffOnly) meas.forEach(([l,fn])=>rows.push(`<tr><td>${l}</td>${cols.map(b=>`<td class="num">${fn(b)}</td>`).join('')}</tr>`));
  Object.entries(PARAM_DEF).forEach(([g,list])=>{
    const body=list.map(([k,l,u,d])=>{ const vals=cols.map(b=>b.params[k]); const counts={}; vals.forEach(v=>counts[v]=(counts[v]||0)+1);
      const major=+Object.entries(counts).sort((a,b)=>b[1]-a[1])[0][0]; const diff=Object.keys(counts).length>1; if(diff) nd++;
      if(S.diffOnly&&!diff) return '';
      return `<tr class="${diff?'diff':''}"><td>${l}</td>${vals.map(v=>`<td class="num ${diff&&v!==major?'odd':''}">${f(v,d)} ${u}</td>`).join('')}</tr>`; }).join('');
    if(body) rows.push(`<tr class="sec"><td colspan="${cols.length+1}">${g}</td></tr>`+body);
  });
  return `<div class="alert ${nd?'warn':'ok'}"><span class="ic">${nd?'⚠️':'✅'}</span><div><b>${nd?`${nd} paramètre${nd>1?'s':''} diffère${nd>1?'nt':''} entre les BMS`:'Paramètres identiques sur tous les BMS'}</b><small>Les valeurs hors majorité sont surlignées en orange.</small></div>
    <button class="btn act" data-act="diffonly">${S.diffOnly?'Tout afficher':'Seulement les différences'}</button></div>
    <div class="card tblwrap" style="margin-top:12px"><table class="tbl"><tr><th></th>${cols.map(b=>`<th class="num"><a href="#/pack/${p.id}/bms/${b.id}/params">${bn(b)}</a></th>`).join('')}</tr>${rows.join('')}</table></div>`;
}

function cellsBlock(vals, unit, dec, scaleMin, balIdx=-1, highBad=false){
  const mn=Math.min(...vals), mx=Math.max(...vals), lo=scaleMin??(mn-((mx-mn)||.01)*1.5), rg=(mx-lo)||1;
  const iMin=vals.indexOf(mn), iMax=vals.indexOf(mx);
  return `<div class="cells">${vals.map((v,i)=>`<div class="cell ${i===iMin?(highBad?'max':'min'):i===iMax?(highBad?'min':'max'):''} ${i===balIdx?'balc':''}" title="Cellule ${i+1} : ${f(v,dec)} ${unit}">
    <span class="v">${f(v,dec)}</span><div class="col" style="height:${Math.max(6,(v-lo)/rg*100)}%"></div><span class="n">${i+1}</span></div>`).join('')}</div>`;
}

/* =========================================================
   CONNEXION HOME ASSISTANT (WebSocket)
   ========================================================= */
function wsSend(msg, cb){
  if(S.hass){ S.hass.connection.sendMessagePromise(msg).then(r=>cb&&cb(r)).catch(()=>cb&&cb(null)); return; }
  const id=S.wsId++; msg.id=id; if(cb) S.pending[id]=cb; S.ws.send(JSON.stringify(msg)); return id; }
const haReady = () => !!S.hass || (S.ws && S.ws.readyState===1);
/* Page intégrée dans Home Assistant (même origine) : on réutilise la session HA, sans jeton */
function tryParentHass(){
  try{
    if(window.parent===window) return false;
    const el=window.parent.document.querySelector('home-assistant'); const hass=el&&el.hass;
    if(!hass||!hass.connection) return false;
    S.hass=hass; S.haStatus='Connecté automatiquement (page intégrée à Home Assistant)';
    buildFromStates(Object.values(hass.states));
    hass.connection.subscribeEvents(ev=>{ if(ev.data&&ev.data.new_state&&applyState(ev.data.new_state)) S.dirty=true; },'state_changed');
    return S.mode==='ha';
  }catch(e){ return false; }
}
function connectHA(url, token){
  try{ S.ws && S.ws.close(); }catch(e){}
  S.haStatus='Connexion…'; render();
  let ws; try{ ws=new WebSocket(url); }catch(e){ S.haStatus='URL invalide'; render(); return; }
  S.ws=ws;
  ws.onmessage = ev => {
    const m=JSON.parse(ev.data);
    if(m.type==='auth_required') ws.send(JSON.stringify({type:'auth',access_token:token}));
    else if(m.type==='auth_invalid'){ S.haStatus='Jeton refusé'; render(); }
    else if(m.type==='auth_ok'){
      S.haStatus='Authentifié, lecture des entités…'; render();
      wsSend({type:'get_states'}, res=>{ buildFromStates(res); wsSend({type:'subscribe_events',event_type:'state_changed'}); });
    }
    else if(m.type==='result' && S.pending[m.id]){ const cb=S.pending[m.id]; delete S.pending[m.id]; cb(m.success?m.result:null, m); }
    else if(m.type==='event' && m.event && m.event.data && m.event.data.new_state){ if(applyState(m.event.data.new_state)) S.dirty=true; }
  };
  ws.onerror = () => { S.haStatus='Erreur de connexion'; render(); };
  ws.onclose = () => { if(S.mode==='ha'){ S.haStatus='Connexion perdue'; render(); } };
}
const ENT_RE = /^(sensor|binary_sensor|number|switch)\.pack_(\d+)_bms_(\d+|master)_(.+)$/i;
const bmsId = k => /^master$/i.test(k) ? 1 : +k;          // BMS_master = BMS n°1
const bmsKey = b => b.key || b.id;                          // morceau réel du nom d'entité
function blankBms(pack,id){ const params={},switches={}; Object.values(PARAM_DEF).flat().forEach(p=>params[p[0]]=null); SW_DEF.forEach(s=>switches[s[0]]=null);
  return {pack,id,online:true,ts:0,cells:Array(16).fill(0),res:Array(16).fill(0),voltage:0,current:0,power:0,soc:0,capRem:0,capNom:0,t1:0,t2:0,mos:0,balance:0,deltaMv:0,
    soh:0,cycles:0,runtime:'—',chargeStatus:'—',alarms:[],chargeMos:false,dischargeMos:false,params,switches,weak:{cell:1,lowestDays:0,resRise:0},res30:null}; }
function buildFromStates(states){
  if(!states){ S.haStatus='Lecture impossible'; render(); return; }
  S.lastStates=states;
  const packs={};
  states.forEach(s=>{ const m=s.entity_id.match(ENT_RE); if(!m) return; const pi=+m[2], bi=bmsId(m[3]);
    packs[pi] ||= {id:pi,name:`Pack ${pi}`,link:'HA',bms:{}}; if(!packs[pi].bms[bi]){ packs[pi].bms[bi]=blankBms(pi,bi); packs[pi].bms[bi].key=m[3].toLowerCase(); } });
  states.forEach(s=>{ const m=s.entity_id.match(/^sensor\.smartphoton_jk_bms_multi_pack_pack_(\d+)_summary$/); if(m&&packs[+m[1]]){ const a=s.attributes||{};
    packs[+m[1]].name = a.pack_name || a.name || (a.friendly_name||'').replace(/\s*summary$/i,'') || packs[+m[1]].name;
    packs[+m[1]].expectedBms = +a.bms_count || null; packs[+m[1]].summaryAttrs = a; } });
  const list=Object.values(packs).sort((a,b)=>a.id-b.id).map(p=>({...p,bms:Object.values(p.bms).sort((a,b)=>a.id-b.id)}));
  if(!list.length){ PACKS=[]; S.mode='waiting'; S.haStatus='Aucune entité pack_X_bms_Y trouvée'; render(); return; }
  PACKS=list; EVENTS=[]; S.mode='ha'; S.histCache={};
  states.forEach(applyState);
  S.haStatus=`Connecté · ${list.length} packs, ${allBms().length} BMS`;
  // N'appliquer la navigation automatique qu'à la première connexion,
  // jamais lors d'une navigation volontaire de l'utilisateur.
  if(!S.autoRouteApplied){
    S.autoRouteApplied=true;
    if(!location.hash || location.hash==='#/' ){
      if(PACKS.length===1){
        const p=PACKS[0];
        location.hash=p.bms.length===1 ? `#/pack/${p.id}/bms/${p.bms[0].id}/live` : `#/pack/${p.id}`;
      }
    }
  }
  render();
}
function applyState(s){
  const m=s.entity_id.match(ENT_RE); if(!m) return false;
  const p=PACKS.find(x=>x.id===+m[2]); const b=p&&p.bms.find(x=>x.id===bmsId(m[3])); if(!b) return false;
  const k=m[4], raw=s.state, v=parseFloat(raw), ts=Date.parse(s.last_updated||s.last_changed)||Date.now();
  if(raw==='unavailable'||raw==='unknown'){ if(k==='tension_totale_volt') b.online=false; return true; }
  b.ts=Math.max(b.ts,ts);
  const map={tension_totale_volt:'voltage',courant_total:'current',puissance_totale:'power',soc_pourcentage:'soc',capacite_restante_ah:'capRem',capacite_batterie_ah:'capNom',
    sonde_1_temp:'t1',sonde_2_temp:'t2',mos_temp:'mos',balance_courant:'balance',soh_pourcentage:'soh',nombre_cycle:'cycles'};
  let mm;
  if(map[k]){ b[map[k]]=v; if(k==='tension_totale_volt') b.online=true; }
  else if(k==='cell_voltage_delta') b.deltaMv=v*1000;
  else if(k==='total_runtime_formatted') b.runtime=raw;
  else if(k==='charge_status_text') b.chargeStatus=raw;
  else if(k==='alarm_list'){ b.alarmRaw = (!raw||/^\s*(ok|none|normal|aucune?( alarme)?s?|no( active)? alarms?|pas d.?alarme|-|0|\[\])\s*$/i.test(raw)) ? [] : raw.replace(/[\[\]']/g,'').split(/[,;|]/).map(x=>x.trim()).filter(Boolean); }
  else if(k==='alarm_active') b.alarmActive = raw==='on';
  else if(k==='switch_charge') b.chargeMos = raw==='on';
  else if(k==='switch_decharge') b.dischargeMos = raw==='on';
  else if((mm=k.match(/^cell_(\d+)_volt$/))) b.cells[+mm[1]-1]=v;
  else if((mm=k.match(/^cell_(\d+)_ohm$/))) b.res[+mm[1]-1]=v;
  else if(m[1]==='number' && k in b.params) b.params[k]=v;
  else if(m[1]==='switch'){ const sk=k.replace(/_active_polling$/,''); if(sk in b.switches) b.switches[sk]=raw==='on'; }
  else return false;
  if(!b.deltaMv && b.cells.some(Boolean)){ const c=b.cells.filter(Boolean); b.deltaMv=(Math.max(...c)-Math.min(...c))*1000; }
  if(b.capNom==null||!b.capNom) b.capNom = b.params.bms_total_battery_capacity_ah||0;
  const list=b.alarmRaw||[];
  b.alarms = b.alarmActive===false ? [] : b.alarmActive===true ? (list.length?list:['Alarme active (détail non fourni)']) : list;
  return true;
}
function fetchHistory(ent, mins, mult, ck){
  if(!haReady()) return;
  S.histCache[ck]='loading';
  const end=new Date(), start=new Date(end-mins*MIN);
  wsSend({type:'history/history_during_period',start_time:start.toISOString(),end_time:end.toISOString(),entity_ids:[ent],minimal_response:true,no_attributes:true}, res=>{
    const arr=(res&&res[ent])||[], t=[], v=[];
    arr.forEach(x=>{ const val=parseFloat(x.s); const ts=(x.lu||x.lc)*1000||Date.parse(x.last_updated||x.last_changed); if(!isNaN(val)&&ts){ t.push(Math.max(ts,start.getTime())); v.push(val*mult); } });
    if(t.length){ t.push(Date.now()); v.push(v.at(-1)); }
    S.histCache[ck]={t,v}; S.dirty=true;
  });
}
function callService(domain, service, data){
  if(S.mode!=='ha'||!haReady()) return Promise.reject(new Error('Home Assistant non connecté'));
  if(S.hass) return Promise.resolve().then(()=>S.hass.callService(domain,service,data));
  return new Promise((resolve,reject)=>wsSend({type:'call_service',domain,service,service_data:data},
    (result,response)=>response&&response.success ? resolve(result) : reject(new Error('Service Home Assistant refusé'))));
}

/* =========================================================
   ACTIONS
   ========================================================= */
function openModal(html){ S.modal=true; document.getElementById('modal').innerHTML=`<div class="modal-bg" data-act="close-bg"><div class="modal">${html}</div></div>`; }
function closeModal(){ S.modal=null; document.getElementById('modal').innerHTML=''; render(); }
function currentBms(){ const m=(location.hash||'').match(/^#\/pack\/(\d+)\/bms\/(\d+)/); if(!m) return null; const p=PACKS.find(x=>x.id==m[1]); return p&&{p,b:p.bms.find(x=>x.id==m[2])}; }

function toggleMenu(open){
  document.getElementById('side').classList.toggle('open',open);
  document.getElementById('scrim').classList.toggle('open',open);
  document.body.classList.toggle('menu-open',open);
}
document.getElementById('scrim').addEventListener('click',()=>toggleMenu(false));
addEventListener('keydown',e=>{ if(e.key==='Escape') toggleMenu(false); });
let touchX=null; const sideEl=document.getElementById('side');
sideEl.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX},{passive:true});
sideEl.addEventListener('touchend',e=>{ if(touchX!=null && touchX-e.changedTouches[0].clientX>60) toggleMenu(false); touchX=null; },{passive:true});
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]');
  if(!el){ const card=e.target.closest('[data-href]'); if(card && !e.target.closest('a,button,.ch-plot')) location.hash=card.dataset.href; return; }
  const act=el.dataset.act;
  if(act==='menu-open'){ toggleMenu(true); return; }
  if(act==='menu-close'){ toggleMenu(false); return; }
  if(act==='exp'){ e.stopPropagation(); const id=+el.dataset.id; S.expanded.has(id)?S.expanded.delete(id):S.expanded.add(id); render(); }
  else if(act==='range'){ S.range=el.dataset.v; render(); }
  else if(act==='filter'){ S.logFilter=el.dataset.v; render(); }
  else if(act==='diffonly'){ S.diffOnly=!S.diffOnly; render(); }
  else if(act==='theme'){ const t=document.documentElement.dataset.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme=t; store.set('jk-theme',t); render(); }
  else if(act==='fs'){ const d=document.documentElement; (document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen())?.catch?.(()=>{}); }
  else if(act==='edit'){ if(S.mode!=='ha'||!haReady()) return; S.edit={key:el.dataset.key,values:{},sw:{}}; render(); }
  else if(act==='cancel'){ S.edit=null; render(); }
  else if(act==='sw'){ const c=currentBms(); const k=el.dataset.k; const cur=k in S.edit.sw?S.edit.sw[k]:c.b.switches[k]; S.edit.sw[k]=!cur; render(); }
  else if(act==='save'){
    const {p,b}=currentBms(), E=S.edit, list=[];
    Object.entries(E.values).forEach(([k,v])=>{ if(+v!==b.params[k]){ const d=PARAM_INDEX[k]; list.push({k,type:'num',label:d.label,from:`${f(b.params[k],d.dec)} ${d.unit}`,to:`${f(+v,d.dec)} ${d.unit}`,v:+v}); }});
    Object.entries(E.sw).forEach(([k,v])=>{ if(v!==b.switches[k]) list.push({k,type:'sw',label:SW_DEF.find(s=>s[0]===k)[1],from:b.switches[k]?'ON':'OFF',to:v?'ON':'OFF',v}); });
    const risky=list.some(x=>/charging_switch|discharging_switch|protection|power_off/.test(x.k));
    S.pendingChanges={p,b,list};
    openModal(`<h3>Envoyer ${list.length} modification${list.length>1?'s':''} au ${bn(b)} ?</h3><small style="color:var(--mut)">${esc(p.name)}</small>
      <ul>${list.map(x=>`<li>${x.label} : <b>${x.from}</b> → <b style="color:var(--flow)">${x.to}</b></li>`).join('')}</ul>
      ${risky?`<div class="alert warn"><span class="ic">⚠️</span><div><b>Réglage sensible</b><small>Ces paramètres touchent aux MOS ou aux protections : une erreur peut couper le pack.</small></div></div>`:''}
      <div class="row"><button class="btn" data-act="close">Annuler</button><button class="btn ${risky?'danger':'primary'}" data-act="confirm">Confirmer l’envoi</button></div>`);
  }
  else if(act==='confirm'){
    const {p,b,list}=S.pendingChanges;
    // Ne jamais écrire localement la valeur demandée : seul un nouvel état HA
    // provenant de la relecture du BMS doit modifier l'affichage.
    list.forEach(x=>{
      const domain=x.type==='num'?'number':'switch';
      const service=x.type==='num'?'set_value':(x.v?'turn_on':'turn_off');
      const entity_id=x.type==='num'
        ? `number.pack_${p.id}_bms_${bmsKey(b)}_${x.k}`
        : `switch.pack_${p.id}_bms_${bmsKey(b)}_${x.k}_active_polling`;
      const data=x.type==='num'?{entity_id,value:x.v}:{entity_id};
      callService(domain,service,data).then(()=>{
        EVENTS.unshift({t:Date.now(),lvl:'info',cat:'param',pack:p.id,bms:b.id,
          txt:'Commande transmise',det:`${x.label} : ${x.from} → ${x.to} · relecture BMS à vérifier`});
      }).catch(err=>{
        EVENTS.unshift({t:Date.now(),lvl:'crit',cat:'param',pack:p.id,bms:b.id,
          txt:'Commande refusée',det:`${x.label} : ${String(err.message||err)}`});
      });
    });
    S.pendingChanges=null; S.edit=null; closeModal();
  }
  else if(act==='copy-report'){ const t=entityReportText(); const done=()=>{el.textContent='✅ Copié';};
    (navigator.clipboard?navigator.clipboard.writeText(t).then(done):Promise.reject()).catch(()=>{ const r=document.createRange(); r.selectNodeContents(document.getElementById('ent-report')); const sel=getSelection(); sel.removeAllRanges(); sel.addRange(r); try{document.execCommand('copy');done();}catch(_){} }); }
  else if(act==='close') closeModal();
  else if(act==='close-bg'){ if(e.target===el) closeModal(); }
  else if(act==='ha-on'){
    const url=document.getElementById('ha-url').value.trim(), tok=document.getElementById('ha-token').value.trim();
    S.haUrl=url; store.set('jk-ha-url',url);
    if(document.getElementById('ha-remember').checked) store.set('jk-ha-token',tok); else store.del('jk-ha-token');
    if(!tok){ S.haStatus='Jeton manquant'; render(); return; }
    connectHA(url,tok);
  }
  else if(act==='ha-off'){ try{S.ws&&S.ws.close()}catch(_){} S.ws=null; S.mode='waiting'; PACKS=[]; EVENTS=[]; S.haStatus='Déconnecté'; render(); }
});
document.addEventListener('input', e=>{
  if(e.target.dataset.param && S.edit){ S.edit.values[e.target.dataset.param]=e.target.value;
    const {b}=currentBms(); e.target.classList.toggle('changed', +e.target.value!==b.params[e.target.dataset.param]);
    const n=Object.keys(S.edit.values).filter(k=>+S.edit.values[k]!==b.params[k]).length+Object.keys(S.edit.sw).filter(k=>S.edit.sw[k]!==b.switches[k]).length;
    const btn=document.querySelector('[data-act="save"]'); if(btn){ btn.disabled=!n; btn.textContent='Enregistrer'+(n?` (${n})`:''); } }
});

/* =========================================================
   ROUTEUR & RENDU
   ========================================================= */
let lastRoute=null;
function render(){
  const route=(location.hash||'#/').slice(1)||'/', m=route.match(/^\/pack\/(\d+)(?:\/(compare)|\/bms\/(\d+)(?:\/(\w+))?)?/);
  const app=document.getElementById('app'); app.classList.toggle('wall', route==='/wall');
  for(const k in CHARTS) delete CHARTS[k];
  let html;
  if(route==='/settings') html=pageSettings();
  else if(!PACKS.length && S.mode!=='demo') html=header('SmartPhoton','En attente des données JK-BMS')+`<div class="alert info"><span class="ic">🔌</span><div><b>${esc(S.haStatus)}</b><small>Ouvrez Glow depuis le tableau de bord Home Assistant. Si la session ne peut pas être réutilisée, configurez une connexion dans les réglages. Aucune donnée fictive n’est affichée.</small></div></div><p><a class="btn primary" href="#/settings">Connexion Home Assistant</a></p>`;
  else if(route==='/wall') html=pageWall();
  else if(m){ const p=PACKS.find(x=>x.id==m[1]); const b=m[3]&&p?.bms.find(x=>x.id==m[3]);
    html = b ? pageBms(p,b,m[4]||'live') : p ? pagePack(p,m[2]) : pageOverview(); }
  else if(route==='/aggregation') html=pageAggregation();
  else if(route==='/diagnostics') html=pageDiagnostics();
  else if(route==='/journal') html=pageJournal();
  else if(route==='/settings') html=pageSettings();
  else html=pageOverview();
  document.getElementById('main').innerHTML=html;
  document.getElementById('side').innerHTML=sidebar(route);
  if(lastRoute!==route){ toggleMenu(false); lastRoute=route; }
  document.getElementById('bnav').innerHTML=route==='/wall'?'':bottomNav(route);
  document.getElementById('bnav').style.display=route==='/wall'?'none':'';
  tickFresh();
}
function tickFresh(){
  document.querySelectorAll('.fresh').forEach(el=>{ const ts=+el.dataset.ts; if(!ts){el.textContent='—';return;} el.textContent=relTime(ts); el.classList.toggle('old',(Date.now()-ts)/1000>TH.staleSec); });
  const c=document.getElementById('wallclock'); if(c) c.textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
const canAutoRender = () => !S.edit && !S.modal && !(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) && !document.querySelector('.ch-plot:hover');
addEventListener('hashchange',()=>{ S.edit=null; render(); scrollTo(0,0); });
setInterval(tickFresh,1000);
setInterval(()=>{ if(S.mode==='ha' && S.dirty && canAutoRender()){ S.dirty=false; render(); } },1000);

/* Simulation live (démo) : nouvelle mesure toutes les 5 s, un point d'historique par minute */
let tick=0;
setInterval(()=>{
  if(S.mode!=='demo') return; tick++;
  allBms().forEach(b=>{
    if(b.staleSim && tick%15!==0) return;           // ce BMS « décroche » pour montrer la détection de données anciennes
    const H=b.H, L=H.cur.length-1;
    H.cur[L] += (Math.random()-.5)*0.6; H.soc[L]=Math.max(1,Math.min(100,H.soc[L]+H.cur[L]*5/3600/b.capNom*100));
    H.volt[L]=16*(ocv(H.soc[L])+H.cur[L]*0.0006); H.delta[L]=Math.max(1,H.delta[L]+(Math.random()-.5)*0.6); H.temp[L]+= (Math.random()-.5)*0.15;
    if(tick%12===0){ ['cur','soc','volt','delta','temp'].forEach(k=>{ H[k].push(H[k][L]); H[k].shift(); }); H.t0+=MIN; }
    const wasAlarm=b.alarms.length; syncFromHistory(b); b.ts=Date.now();
    if(!wasAlarm && b.alarms.length) EVENTS.unshift({t:Date.now(),lvl:'crit',cat:'alarm',pack:b.pack,bms:b.id,txt:'Alarme : sous-tension cellule',det:`SOC ${f(b.soc,0)} %`});
  });
  if(canAutoRender()) render();
},5000);

/* Démarrage */
document.documentElement.dataset.theme = store.get('jk-theme') || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
if(new URLSearchParams(location.search).get('demo')==='1'){
  buildDemo();
}else{
  S.mode='waiting';
  S.haStatus='Connexion automatique en attente';
  // La session HA peut devenir disponible après le chargement de l'iframe.
  if(!tryParentHass()){
    let attempts=0;
    const retry=setInterval(()=>{
      if(S.mode==='ha'||++attempts>=15){ clearInterval(retry); return; }
      tryParentHass();
    },2000);
  }
}
render();
</script>
</body>
</html>

---
configuration:
  communication_debug:
    name: 🔴 JK-BMS → Debugowanie komunikacji
    description: Włącza szczegółowe logi komunikacji do diagnostyki i wsparcia.
  bms_broadcasting:
    name: 🔴 JK-BMS → Broadcasting BMS
    description: Włącza Broadcasting JK-BMS. Wyłącz tę opcję, aby używać Active Polling.
  multi_pack_section:
    name: ────────── MULTI-PACK ──────────
    description: Konfiguracja niezależnych pakietów JK-BMS z Broadcasting lub Active Polling.
  multi_pack_enabled:
    name: 🔷 Multi-Pack → Włącz
    description: Włącza architekturę Multi-Pack. Zalecane dla nowych instalacji, nawet z jednym pakietem. Każdy pakiet ma stałą identyfikację techniczną i własny transport.
  multi_pack_active_polling:
    name: 🔷 Multi-Pack → Active Polling
    description: Włącza Active Polling Multi-Pack przy wyłączonym Broadcasting. Obsługuje TCP/IP i bezpośrednie USB/RS485.
  multi_pack_packs:
    name: 🔷 Multi-Pack → Pakiety
    description: Skonfiguruj do pięciu niezależnych pakietów. Każdy może korzystać z TCP/IP albo USB/RS485 z Broadcasting lub Active Polling.
    fields:
      id:
        name: ID pakietu
        description: Stały identyfikator techniczny od pack_1 do pack_5. Nie zmieniaj po uruchomieniu.
      name:
        name: Nazwa pakietu
        description: Przyjazna nazwa wyświetlana na dashboardach.
      transport:
        name: Transport
        description: tcp dla bramki RS485 TCP/IP albo serial dla lokalnego adaptera USB/RS485.
      gateway_ip_port:
        name: IP bramki + port
        description: Wymagane dla pakietów TCP, np. 192.168.1.101:5000.
      path:
        name: Ścieżka szeregowa
        description: Wymagana dla pakietów szeregowych. Preferuj stałą ścieżkę /dev/serial/by-id/....
      bms_addresses:
        name: Adresy BMS
        description: Tylko Active Polling. Adresy BMS od 1 do 15 rozdzielone przecinkami, np. 1,2,3.
  legacy_section:
    name: ────────── LEGACY / POJEDYNCZA MAGISTRALA ──────────
    description: Konfiguracja zgodności dla dotychczasowej pojedynczej magistrali RS485.
  jkbms_path:
    name: 🟪 JK-BMS → Port szeregowy
    description: Stała ścieżka USB/RS485 dla Legacy oraz fallback zgodności dla jednego szeregowego pakietu Multi-Pack.
  jkbms_count:
    name: 🟪 JK-BMS → Liczba modułów BMS
    description: Łączna liczba modułów JK-BMS na magistrali RS485 Legacy (od 1 do 15).
  use_gateway:
    name: 🟨 JK-BMS → Użyj bramki TCP
    description: Używa bramki TCP/IP zamiast lokalnego interfejsu USB/RS485 w trybie Legacy.
  gateway_ip_port:
    name: 🟨 JK-BMS → IP bramki + port
    description: Adres IP i port TCP bramki JK-BMS Legacy, np. 192.168.1.100:5000.
  non_broadcasting_data_interval_s:
    name: ⏱️ JK-BMS → Interwał Active Polling (s)
    description: 'Czas między cyklami LIVE przy wyłączonym Broadcasting. Dozwolony zakres: 1 do 30 sekund.'
  CAN_bus_usage:
    name: 🔴 JK-BMS → Użycie magistrali CAN
    description: Włącza komunikację i transmisję CAN, gdy interfejs CAN jest fizycznie podłączony.
  mqttadresse_port:
    name: 🚩 MQTT → Adres brokera + port
    description: Adres i port brokera MQTT, np. core-mosquitto.local.hass.io:1883.
  mqttuser:
    name: 🚩 MQTT → Nazwa użytkownika
    description: Nazwa użytkownika do połączenia z brokerem MQTT.
  mqttpass:
    name: 🚩 MQTT → Hasło
    description: Hasło do połączenia z brokerem MQTT.
  Send_bip:
    name: 📊 Anonimowe statystyki użycia
    description: Wysyła przy starcie anonimowy ping użycia. Żadne prywatne dane nie są przesyłane.
  premium_section:
    name: ────────── PREMIUM ──────────
    description: Licencja SmartPhoton Premium i funkcje Premium.
  premium_key:
    name: 👑 Premium → Klucz licencyjny
    description: Klucz SmartPhoton Premium. Pozostaw pusty, jeśli Premium nie jest używane.
  dashboard_section:
    name: ────────── DASHBOARD ──────────
    description: Ustawienia dashboardów SmartPhoton.
  dashboard_custom_cards_installed:
    name: 🎨 Dashboard → Zainstalowane karty niestandardowe
    description: Włącz, gdy wymagane niestandardowe karty Home Assistant są zainstalowane.
  dashboard_language:
    name: 🎨 Dashboard → Język
    description: Język dashboardów SmartPhoton Premium.
  dashboard_mode:
    name: 🎨 Dashboard → Tryb
    description: 'Tylko dla trybu Legacy: legacy = Home Assistant/Lovelace, html = dashboard HTML, both = oba. Multi-Pack Premium używa dedykowanego dashboardu Multi-Pack.'

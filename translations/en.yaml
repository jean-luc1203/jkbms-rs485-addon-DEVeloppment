---
configuration:
  communication_debug:
    name: 🔴 JK-BMS → Communication debug
    description: Enable detailed communication logs for diagnosis and support.
  bms_broadcasting:
    name: 🔴 JK-BMS → BMS Broadcasting
    description: Enable JK-BMS Broadcasting mode. Multi-Pack currently requires Broadcasting.
  multi_pack_section:
    name: ────────── MULTI-PACK ──────────
    description: Configuration for several independent JK-BMS battery packs.
  multi_pack_enabled:
    name: 🔷 Multi-Pack → Enable
    description: Enable Multi-Pack mode. Recommended for new Broadcasting installations, even with a single pack. Each pack has a stable technical identity and its own transport.
  multi_pack_packs:
    name: 🔷 Multi-Pack → Packs
    description: Configure up to five independent packs. Each pack may use TCP/IP or USB/RS485.
    fields:
      id:
        name: Pack ID
        description: Stable technical ID from pack_1 to pack_5. Do not change it after commissioning.
      name:
        name: Pack name
        description: Friendly name displayed in dashboards.
      transport:
        name: Transport
        description: Use tcp for an RS485 TCP/IP gateway or serial for a local USB/RS485 adapter.
      gateway_ip_port:
        name: Gateway IP + port
        description: Required for TCP packs, for example 192.168.1.101:5000.
      path:
        name: Serial path
        description: Required for serial packs. Use a persistent /dev/serial/by-id/... path.
  legacy_section:
    name: ────────── LEGACY / SINGLE BUS ──────────
    description: Compatibility configuration for the historical single RS485 bus.
  jkbms_path:
    name: 🟪 JK-BMS → Serial port path
    description: Persistent USB/RS485 path used by Legacy mode and as a compatibility fallback for one Multi-Pack serial pack.
  jkbms_count:
    name: 🟪 JK-BMS → Number of BMS modules
    description: Total number of JK-BMS modules on the Legacy RS485 bus (1 to 15).
  use_gateway:
    name: 🟨 JK-BMS → Use TCP gateway
    description: Use a TCP/IP gateway instead of the local USB/RS485 interface in Legacy mode.
  gateway_ip_port:
    name: 🟨 JK-BMS → Gateway IP + port
    description: IP address and TCP port of the Legacy JK-BMS gateway, for example 192.168.1.100:5000.
  non_broadcasting_data_interval_s:
    name: ⏱️ JK-BMS → Active Polling interval (s)
    description: 'Time between LIVE polling cycles when Broadcasting is disabled. Allowed range: 1 to 30 seconds.'
  CAN_bus_usage:
    name: 🔴 JK-BMS → CAN bus usage
    description: Enable CAN communication and data transmission when a CAN interface is physically connected.
  mqttadresse_port:
    name: 🚩 MQTT → Broker address + port
    description: MQTT broker address and port, for example core-mosquitto.local.hass.io:1883.
  mqttuser:
    name: 🚩 MQTT → Username
    description: Username used to connect to the MQTT broker.
  mqttpass:
    name: 🚩 MQTT → Password
    description: Password used to connect to the MQTT broker.
  Send_bip:
    name: 📊 Anonymous usage statistics
    description: Send an anonymous usage ping at startup. No private data is transmitted.
  premium_section:
    name: ────────── PREMIUM ──────────
    description: SmartPhoton Premium license and Premium features.
  premium_key:
    name: 👑 Premium → License key
    description: SmartPhoton Premium license key. Leave empty when Premium is not used.
  dashboard_section:
    name: ────────── DASHBOARD ──────────
    description: SmartPhoton dashboard settings.
  dashboard_custom_cards_installed:
    name: 🎨 Dashboard → Custom cards installed
    description: Enable when the required Home Assistant custom cards are installed.
  dashboard_language:
    name: 🎨 Dashboard → Language
    description: Language used by SmartPhoton Premium dashboards.
  dashboard_mode:
    name: 🎨 Dashboard → Mode
    description: 'Legacy runtime only: legacy = Home Assistant/Lovelace, html = HTML dashboard, both = both. Multi-Pack Premium uses its dedicated Multi-Pack dashboard.'

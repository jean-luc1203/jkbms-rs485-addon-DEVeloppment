---
configuration:
  communication_debug:
    name: 🔴 JK-BMS → Débogage de la communication
    description: Activer l'affichage détaillé des journaux de communication pour le diagnostic et le support.
  bms_broadcasting:
    name: 🔴 JK-BMS → Diffusion BMS (Broadcasting)
    description: Activer le mode Broadcasting du JK-BMS. Désactiver cette option pour utiliser Active Polling.
  multi_pack_section:
    name: ────────── MULTI-PACK ──────────
    description: "Configuration de plusieurs packs JK-BMS indépendants, en Broadcasting ou Active Polling. Guide de configuration : https://github.com/jean-luc1203/jkbms-rs485-addon-DEVeloppment/blob/main/Documentation/MULTI-PACK-CONFIG.md"
  multi_pack_active_polling:
    name: 🔷 Multi-Pack → Active Polling
    description: Activer Active Polling en Multi-Pack lorsque le Broadcasting est désactivé. Compatible TCP/IP et USB/RS485 direct.
  multi_pack_packs:
    name: 🔷 Multi-Pack → Packs
    description: "Configurer jusqu'à cinq packs indépendants. Chaque pack peut utiliser TCP/IP ou USB/RS485 en Broadcasting ou Active Polling."
    fields:
      id:
        name: ID du pack
        description: Identifiant technique stable de pack_1 à pack_5. Ne pas le changer après la mise en service.
      name:
        name: Nom du pack
        description: Nom convivial affiché dans les dashboards.
      transport:
        name: Transport
        description: Utiliser tcp pour une passerelle RS485 TCP/IP ou serial pour un adaptateur USB/RS485 local.
      gateway_ip_port:
        name: IP passerelle + port
        description: Obligatoire pour un pack TCP, par exemple 192.168.1.101:5000.
      path:
        name: Chemin série
        description: Obligatoire pour un pack série. Utiliser de préférence un chemin persistant /dev/serial/by-id/....
      bms_addresses:
        name: Adresses BMS
        description: Active Polling uniquement. Utiliser auto (recommandé) pour scanner automatiquement les adresses 1 à 15, ou saisir une liste manuelle séparée par des virgules, par exemple 1,3,7.
  non_broadcasting_data_interval_s:
    name: ⏱️ JK-BMS → Intervalle Active Polling (s)
    description: "Délai entre les cycles LIVE lorsque le Broadcasting est désactivé. Plage autorisée : 1 à 30 secondes."
  CAN_bus_usage:
    name: 🔴 JK-BMS → Utilisation du bus CAN
    description: Activer la communication et la transmission CAN lorsqu'une interface CAN est physiquement connectée.
  mqttadresse_port:
    name: 🚩 MQTT → Adresse du broker + port
    description: "Adresse et port du broker MQTT, par exemple core-mosquitto.local.hass.io:1883."
  mqttuser:
    name: 🚩 MQTT → Nom d'utilisateur
    description: Nom d'utilisateur utilisé pour se connecter au broker MQTT.
  mqttpass:
    name: 🚩 MQTT → Mot de passe
    description: Mot de passe utilisé pour se connecter au broker MQTT.
  long_term_statistics:
    name: 📈 Home Assistant → Statistiques long terme
    description: "Choisir quels capteurs numériques reçoivent state_class: measurement pour les statistiques long terme de Home Assistant. off = aucune, essential = valeurs principales BMS/pack, cells = essential + tensions individuelles des cellules (recommandé), full = tous les capteurs numériques éligibles."
  Send_bip:
    name: 📊 Statistiques d'utilisation anonymes
    description: Envoyer un ping d'utilisation anonyme au démarrage. Aucune donnée privée n'est transmise.
  premium_section:
    name: ────────── PREMIUM ──────────
    description: Licence SmartPhoton Premium et fonctions Premium.
  premium_key:
    name: 👑 Premium → Clé de licence
    description: Clé de licence SmartPhoton Premium. Laisser vide si Premium n'est pas utilisé.
  dashboard_section:
    name: ────────── DASHBOARD ──────────
    description: Paramètres des dashboards SmartPhoton.
  dashboard_custom_cards_installed:
    name: 🎨 Dashboard → Cartes personnalisées installées
    description: Activer lorsque les cartes personnalisées Home Assistant nécessaires sont installées.
  dashboard_language:
    name: 🎨 Dashboard → Langue
    description: Langue utilisée par les dashboards SmartPhoton Premium.